<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width">
    <meta charset="utf-8">
    <title>To-do List</title>
    <!-- Latest compiled and minified CSS Bootstrap 3 -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <link href="style.css" rel="stylesheet" type="text/css" />
</head>

<body>
    <div class='container'>
        <div class="row">
            <div class="col-xs-12">
                <!-- Title -->
                <h2>To do list</h2>
                <div class="row">
                    <!-- The div where we will display to do list items -->
                    <div class="col-xs-12">
                        <div id="todo-list" class="row">
                        </div>
                    </div>
                    <div class="col-xs-8">
                        <!-- The input element for users to add To Do -->
                        <div id="todo-list">

                        </div>

                        <input id="todo-input" class="form-control" placeholder="New To-Do">
                        <!-- A button for adding ToDos -->
                        <button id="add-button" type="button" class="btn btn-sm btn-primary">Add To-Do</button>
                        <button id="create-task-button" type="button" class="btn btn-sm btn-warning">Create
                            Task</button>
                        <form id="create-task">
                            <input id="new-task-content" type="text" placeholder="new task" required />
                            <button>Create</button>
                        </form>
                    </div>


                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
